<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hänë nui</title>

  <style>
    body{
      margin:0;
      background:#f8f6f1;
      font-family: serif;
      color:#333;
      text-align:center;
    }

    .hero{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

.logo{
  width: 500px;
  max-width: 80%;
  margin-bottom: 20px;
}

    p{
      font-size:1.2rem;
    }

    .feather{
      font-size:3rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%{transform:translateY(0);}
      50%{transform:translateY(-15px);}
      100%{transform:translateY(0);}
    }
  </style>
</head>

<body>

<div class="hero">
  <div class="feather">🪶</div>

  <img src="logo.png" alt="hänë nui" class="logo">

  <p>Handmade Friends from Cloth</p>

  <p>Meet the Friends</p>
</div>

</body>
</html>
