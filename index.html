<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hänë nui</title>

  <style>
    body{
      margin:0;
      background:#f8f6f1;
      font-family: serif;
      color:#333;
      text-align:center;
    }

    .hero{
      min-height: 100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

.logo{
  width: 400px;
  max-width: 75%;
  margin-bottom: 20px;
}

    p{
      font-size:1.2rem;
    }

    .feather{
      font-size:3rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%{transform:translateY(0);}
      50%{transform:translateY(-15px);}
      100%{transform:translateY(0);}
    }
.subtitle{
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  letter-spacing: 1px;
  color: #555;
}

    .friends-area {
  position: relative;
  width: 100%;
  height: 500px;
}

.friend {
  position: absolute;
  height: auto;
  outline: none;
}
.ankou {
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
}
  .hirame {
  top: 185px;
  left: 61%;
  width: 110px;
} 
.whale {
  top: -20px;
  left: 18%;
  width: 180px;
}
  .whale {
  top: -20px;
  left: 18%;
  width: 180px;
  animation: floatWhale 7s ease-in-out infinite;
}
  .penguin {
  top: 230px;
  left: 12%;
  width: 190px;
}
  .jinbei {
  top: 5px;
  left: 77%;
  width: 145px;
}
  .crab {
  top: 110px;
  left: 25%;
  width: 125px;
}
  .katsuo {
  top: 290px;
  left: 69%;
  width: 125px;
}
  .tai {
  top: 310px;
  left: 40%;
  width: 110px;
}
  .sanma {
  top: 430px;
  left: 74%;
  width: 100px;
}
  .tulip {
  top: 520px;
  left: 18%;
  width: 180px;
}
   .rabbit {
  top: 610px;
  left: 58%;
  width: 130px;
}

  .ground {
  width: 100%;
  height: 260px;
  margin-top: 60px;
  background: url("ground1.png") center bottom / cover no-repeat;
}
    @keyframes floatWhale {
  0% {
    transform: translateY(0px) rotate(-2deg);
  }

  50% {
    transform: translateY(-8px) rotate(1deg);
  }

  100% {
    transform: translateY(0px) rotate(-2deg);
  }
}
  </style>
  
</head>

<body>

<div class="hero">
<!-- <div class="feather">🪶</div> -->

  <img src="logo.png.png" alt="hänë nui" class="logo">

  <p class="subtitle">Handmade Friends from Cloth</p>

  <p>Meet the Friends</p>

  <div class="friends-area">
 <img src="anco2.png" alt="Anglerfish" class="friend ankou">
 <img src="hirame0.png" alt="Flounder" class="friend hirame">
 <img src="kujira2.png" alt="Whale" class="friend whale">
<img src="penguin1.png" alt="Penguin" class="friend penguin">
<img src="jinbei2.png" alt="Whale Shark" class="friend jinbei">
<img src="kani1.png" alt="Crab" class="friend crab">
<img src="katuo1.png" alt="Bonito" class="friend katsuo">
<img src="tai5.png" alt="Sea Bream" class="friend tai">
<img src="sanma1.png" alt="Pacific Saury" class="friend sanma">
<img src="tulip1.png" alt="Tulip" class="friend tulip">
<img src="usagi3.png" alt="Rabbit" class="friend rabbit">
</div>

<div class="ground"></div>
  
</div>

</body>
</html>
