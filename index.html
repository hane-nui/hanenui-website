<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hänë nui</title>

  <style>
    body{
      margin:0;
      background:#f8f6f1;
      font-family: serif;
      color:#333;
      text-align:center;
    }

    .hero{
      min-height: 100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

.logo{
  width: 400px;
  max-width: 75%;
  margin-bottom: 20px;
}

    p{
      font-size:1.2rem;
    }

    .feather{
      font-size:3rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%{transform:translateY(0);}
      50%{transform:translateY(-15px);}
      100%{transform:translateY(0);}
    }
.subtitle{
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  letter-spacing: 1px;
  color: #555;
}

    .friends-area {
  position: relative;
  width: 100%;
  height: 500px;
}

.friend {
  position: absolute;
  height: auto;
  outline: none;
}
.ankou {
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
}
  .hirame {
  top: 185px;
  left: 61%;
  width: 110px;
} 
.whale {
  top: -20px;
  left: 18%;
  width: 180px;
}
  .whale {
  top: -5px;
  left: 18%;
  width: 180px;
  animation: floatWhale 10s ease-in-out infinite;
}
  .penguin {
  top: 230px;
  left: 12%;
  width: 190px;
}
  .jinbei {
  top: 5px;
  left: 77%;
  width: 145px;
  animation: floatJinbei 6.5s ease-in-out infinite;
}
  .crab {
  top: 310px;
  left: 40%;
  width: 125px;
  animation: crabWalk 8s ease-in-out infinite;
}
  .katsuo {
  top: 290px;
  left: 69%;
  width: 125px;
}
  .tai {
  top: 110px;
  left: 25%;
  width: 110px;
}
  .sanma {
  top: 430px;
  left: 74%;
  width: 100px;
}
  .tulip {
  top: 520px;
  left: 18%;
  width: 180px;
}
   .rabbit {
  top: 610px;
  left: 42%;
  width: 145px;
  animation: rabbitHop 12s ease-in-out infinite;
}

  .ground {
  width: 100%;
  height: 260px;
  margin-top: 60px;
  background: url("ground1.png") center bottom / cover no-repeat;
}
 @keyframes floatWhale {
  0% {
    transform: translateY(-6px) rotate(-3deg);
  }

  20% {
    transform: translateY(-12px) rotate(-2deg);
  }

  55% {
    transform: translateY(40px) rotate(3deg);
  }

  65% {
  transform: translateY(42px) rotate(2deg);
}
   
  80% {
    transform: translateY(18px) rotate(1deg);
  }

  100% {
    transform: translateY(-6px) rotate(-3deg);
  }
}@keyframes floatWhale {
  0% {
    transform: translateY(-4px) rotate(-3deg);
  }

  20% {
    transform: translateY(-8px) rotate(-2deg);
  }

  55% {
    transform: translateY(20px) rotate(2deg);
  }

  80% {
    transform: translateY(8px) rotate(0deg);
  }

  100% {
    transform: translateY(-4px) rotate(-3deg);
  }
}
    
@keyframes floatJinbei {
  0% {
    transform: translate(0px, 0px) rotate(-2deg);
  }

  25% {
    transform: translate(10px, -8px) rotate(2deg);
  }

  50% {
    transform: translate(20px, 0px) rotate(0deg);
  }

  75% {
    transform: translate(10px, 8px) rotate(-2deg);
  }

  100% {
    transform: translate(0px, 0px) rotate(-2deg);
  }
}
    
@keyframes crabWalk {
  0% {
    transform: translateX(40px);
  }

  20% {
    transform: translateX(40px);
  }

  35% {
    transform: translateX(0px);
  }

  50% {
    transform: translateX(-25px);
  }

  70% {
    transform: translateX(-25px);
  }

  85% {
    transform: translateX(0px);
  }

  100% {
    transform: translateX(40px);
  }
}

@keyframes rabbitHop {

  /* ふわっと現れる */
  0% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 0;
  }

  5% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 1;
  }

  /* 待機 */
  5%, 35% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 1;
  }

  /* しゃがむ */
  38% {
    transform: translate(0, 4px) rotate(0deg);
    opacity: 1;
  }

  /* ホップ① */
  42% {
    transform: translate(-14px, -10px) rotate(-1deg);
    opacity: 1;
  }

  /* 着地 */
  46% {
    transform: translate(-20px, 0) rotate(1deg);
    opacity: 1;
  }

  /* しゃがむ */
  50% {
    transform: translate(-20px, 4px) rotate(0deg);
    opacity: 1;
  }

  /* ステップ② */
  55% {
    transform: translate(-42px, -28px) rotate(-3deg);
    opacity: 1;
  }

  /* 着地 */
  60% {
    transform: translate(-55px, 0) rotate(2deg);
    opacity: 1;
  }

  /* 大ジャンプ！ */
  68% {
    transform: translate(-82px, -80px) rotate(-7deg);
    opacity: 1;
  }

  /* 滞空 */
  71% {
    transform: translate(-86px, -82px) rotate(-6deg);
    opacity: 1;
  }

  /* 着地 */
  75% {
    transform: translate(-95px, 0) rotate(3deg);
    opacity: 1;
  }

  /* チューリップを眺める */
  90% {
    transform: translate(-95px, 0) rotate(-2deg);
    opacity: 1;
  }

  94% {
    transform: translate(-95px, 0) rotate(2deg);
    opacity: 1;
  }

  /* ふわっと消える */
  98% {
    transform: translate(-95px, 0) scale(0.96);
    opacity: 0;
  }

  /* 消えたまま元へ戻る */
  99% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 0;
  }

  /* 元の位置で再登場 */
  100% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 0;
  }
}
  </style>
  
</head>

<body>

<div class="hero">
<!-- <div class="feather">🪶</div> -->

  <img src="logo.png.png" alt="hänë nui" class="logo">

  <p class="subtitle">Handmade Friends from Cloth</p>

  <p>Meet the Friends</p>

  <div class="friends-area">
 <img src="anco2.png" alt="Anglerfish" class="friend ankou">
 <img src="hirame0.png" alt="Flounder" class="friend hirame">
 <img src="kujira2.png" alt="Whale" class="friend whale">
<img src="penguin1.png" alt="Penguin" class="friend penguin">
<img src="jinbei2.png" alt="Whale Shark" class="friend jinbei">
<img src="kani1.png" alt="Crab" class="friend crab">
<img src="katuo1.png" alt="Bonito" class="friend katsuo">
<img src="tai5.png" alt="Sea Bream" class="friend tai">
<img src="sanma1.png" alt="Pacific Saury" class="friend sanma">
<img src="tulip1.png" alt="Tulip" class="friend tulip">
<img src="usagi3.png" alt="Rabbit" class="friend rabbit">
</div>

<div class="ground"></div>
  
</div>

</body>
</html>
